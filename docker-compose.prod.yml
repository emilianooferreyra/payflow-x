# Production overlay. Selected explicitly, never by default:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Only the differences from docker-compose.yml belong here. Everything else —
# images, health checks, networks, volumes — is defined once in the base file so
# the two environments cannot silently drift apart.
services:
  app:
    build:
      target: prod
    restart: unless-stopped

  auth-redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
